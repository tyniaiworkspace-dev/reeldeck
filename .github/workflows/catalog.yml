name: refresh catalog

# Keeps the shelf growing without a server. Dailymotion's API is keyless, so GitHub's
# free runner does the crawl, then commits the new catalog.json for Pages to serve.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl
        run: python3 catalog.py
      - name: Commit
        run: |
          git config user.name "reeldeck-catalog"
          git config user.email "reeldeck@users.noreply.github.com"
          git add catalog.json channels-auto.json 2>/dev/null || git add catalog.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "catalog: $(date -u +%Y-%m-%d) $(python3 -c "import json;c=json.load(open('catalog.json'))['counts'];print(f\"{c['series']} stories, {c['full']} complete, {c['hours']}h\")")"
            git push
          fi
